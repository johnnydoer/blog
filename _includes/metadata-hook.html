<!--
  Site-wide head hooks.
  Interactive Mermaid: pan/zoom, fullscreen lightbox, PNG/SVG export.
  Chirpy renders the diagrams itself; this adds pan/zoom + controls on top.
-->
{% if page.mermaid %}
  <link rel="stylesheet" href="https://unpkg.com/@mostlylucid/mermaid-enhancements@1.0.0/src/styles.css">
  <script type="module">
    (async () => {
      const lib = await import(
        'https://unpkg.com/@mostlylucid/mermaid-enhancements@1.0.0/dist/index.bundle.min.js'
      );

      lib.configure({
        icons: {
          fullscreen: 'fas fa-expand',
          zoomIn: 'fas fa-plus',
          zoomOut: 'fas fa-minus',
          reset: 'fas fa-rotate-left',
          exportPng: 'fas fa-download',
          exportSvg: 'fas fa-code'
        }
      });

      const monoFont =
        "JetBrains Mono, 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace";

      const rerenderWithMono = async () => {
        if (!window.mermaid) return false;
        try {
          mermaid.initialize({ fontFamily: monoFont, fontSize: 14 });
          const code = document.querySelector('code.language-mermaid');
          if (code) {
            for (const pre of document.querySelectorAll('pre.mermaid')) {
              pre.textContent = code.textContent;
              pre.removeAttribute('data-processed');
            }
          }
          await mermaid.init(null, '.mermaid');
          return document.querySelector('.mermaid svg') !== null;
        } catch (err) {
          return false;
        }
      };

      const whenRendered = (cb, tries = 60) => {
        if (document.querySelector('.mermaid svg')) {
          cb();
        } else if (tries > 0) {
          setTimeout(() => whenRendered(cb, tries - 1), 250);
        }
      };

      const enhance = () =>
        whenRendered(() => {
          lib.cleanupMermaidEnhancements?.();
          lib.enhanceMermaidDiagrams();
        });

      const observer = new MutationObserver(() => {
        enhance();
        setTimeout(enhance, 600);
        setTimeout(enhance, 1800);
      });
      observer.observe(document.documentElement, {
        attributes: true,
        attributeFilter: ['data-bs-theme']
      });

      if (document.readyState === 'loading') {
        window.addEventListener('DOMContentLoaded', () => {
          rerenderWithMono().then(enhance);
        });
      } else {
        rerenderWithMono().then(enhance);
      }
    })();
  </script>
{% endif %}
