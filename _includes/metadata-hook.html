<!--
  Site-wide head hooks.
  Interactive Mermaid: pan/zoom, fullscreen lightbox, PNG/SVG export.
  Chirpy renders the diagrams itself; this adds pan/zoom + controls on top.
-->
<script>
  /* Swap hero.png ↔ hero-dark.png on Chirpy theme toggle.
     Skips images already inside a CSS-controlled figure (class .themed-hero).
     Lightbox fix: GLightbox caches hrefs at init and ignores later DOM changes.
     A capture-phase click handler intercepts only hero popup anchors and opens
     a fresh GLightbox instance with the correctly themed URL. */
  (function () {
    var SEL = 'img[src*="/hero.png"]:not(.themed-hero), img[src*="/hero-dark.png"]:not(.themed-hero)';
    function isDark() {
      var attr = document.documentElement.getAttribute('data-bs-theme');
      if (attr === 'dark') return true;
      if (attr === 'light') return false;
      // No explicit toggle — fall back to system preference
      return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    }
    function sync() {
      var dark = isDark();
      document.querySelectorAll(SEL).forEach(function (img) {
        img.src = dark
          ? img.src.replace(/\/hero\.png(\b|$)/, '/hero-dark.png')
          : img.src.replace(/\/hero-dark\.png(\b|$)/, '/hero.png');
      });
    }
    new MutationObserver(sync).observe(document.documentElement, {
      attributes: true, attributeFilter: ['data-bs-theme']
    });
    if (window.matchMedia) {
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', sync);
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', sync);
    } else {
      sync();
    }

    // Intercept hero-image popup clicks before GLightbox uses its cached href.
    // Only targets anchors with class popup/img-link whose href contains /hero.png
    // or /hero-dark.png — leaves all other links (including homepage card links) alone.
    document.addEventListener('click', function (e) {
      var a = e.target.closest('a.popup, a.img-link');
      if (!a) return;
      var raw = a.getAttribute('href') || '';
      if (!raw.match(/\/hero(|-dark)\.png/)) return;
      var dark = isDark();
      var url = dark
        ? raw.replace(/\/hero\.png(\b|$)/, '/hero-dark.png')
        : raw.replace(/\/hero-dark\.png(\b|$)/, '/hero.png');
      e.preventDefault();
      e.stopImmediatePropagation();
      if (typeof GLightbox !== 'undefined') {
        GLightbox({ elements: [{ href: url, type: 'image' }] }).open();
      } else {
        window.open(url, '_blank');
      }
    }, true);
  })();
</script>

{% if page.mermaid %}
  <link rel="stylesheet" href="https://unpkg.com/@mostlylucid/mermaid-enhancements@1.0.0/src/styles.css">
  <script type="module">
    (async () => {
      const lib = await import(
        'https://unpkg.com/@mostlylucid/mermaid-enhancements@1.0.0/dist/index.bundle.min.js'
      );

      lib.configure({
        icons: {
          fullscreen: 'fas fa-expand',
          zoomIn: 'fas fa-plus',
          zoomOut: 'fas fa-minus',
          reset: 'fas fa-rotate-left',
          exportPng: 'fas fa-download',
          exportSvg: 'fas fa-code'
        }
      });

      const monoFont =
        "'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace";

      const rerenderWithMono = async () => {
        if (!window.mermaid) return false;
        try {
          const isDark =
            document.documentElement.getAttribute('data-bs-theme') === 'dark' ||
            (window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          mermaid.initialize({
            theme: isDark ? 'dark' : 'default',
            fontFamily: monoFont,
            fontSize: 14
          });
          const code = document.querySelector('code.language-mermaid');
          if (code) {
            for (const pre of document.querySelectorAll('pre.mermaid')) {
              pre.textContent = code.textContent;
              pre.removeAttribute('data-processed');
            }
          }
          await mermaid.init(null, '.mermaid');
          return document.querySelector('.mermaid svg') !== null;
        } catch (err) {
          return false;
        }
      };

      const whenRendered = (cb, tries = 60) => {
        if (document.querySelector('.mermaid svg')) {
          cb();
        } else if (tries > 0) {
          setTimeout(() => whenRendered(cb, tries - 1), 250);
        }
      };

      const centerLabels = () => {
        document
          .querySelectorAll('.mermaid svg foreignObject div, .mermaid-lightbox-diagram svg foreignObject div')
          .forEach((div) => {
            div.style.display = 'flex';
            div.style.alignItems = 'center';
            div.style.justifyContent = 'center';
            div.style.height = '100%';
          });
      };

      const enhance = () =>
        whenRendered(() => {
          centerLabels();
          lib.cleanupMermaidEnhancements?.();
          lib.enhanceMermaidDiagrams();
        });

      const observer = new MutationObserver(() => {
        setTimeout(() => {
          rerenderWithMono().then(() => {
            enhance();
            setTimeout(enhance, 600);
            setTimeout(enhance, 1800);
          });
        }, 80);
      });
      observer.observe(document.documentElement, {
        attributes: true,
        attributeFilter: ['data-bs-theme']
      });

      if (document.readyState === 'loading') {
        window.addEventListener('DOMContentLoaded', () => {
          rerenderWithMono().then(enhance);
        });
      } else {
        rerenderWithMono().then(enhance);
      }
    })();
  </script>
{% endif %}
