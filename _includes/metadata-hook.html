<!--
  Site-wide head hooks.
  Interactive Mermaid: pan/zoom, fullscreen lightbox, PNG/SVG export.
  Chirpy renders the diagrams itself; this adds pan/zoom + controls on top.
-->
{% if page.mermaid %}
  <link rel="stylesheet" href="https://unpkg.com/@mostlylucid/mermaid-enhancements@1.0.0/src/styles.css">
  <script type="module">
    (async () => {
      const lib = await import(
        'https://unpkg.com/@mostlylucid/mermaid-enhancements@1.0.0/dist/index.bundle.min.js'
      );

      lib.configure({
        icons: {
          fullscreen: 'fas fa-expand',
          zoomIn: 'fas fa-plus',
          zoomOut: 'fas fa-minus',
          reset: 'fas fa-rotate-left',
          exportPng: 'fas fa-download',
          exportSvg: 'fas fa-code'
        }
      });

      const whenRendered = (cb, tries = 60) => {
        if (document.querySelector('.mermaid svg')) {
          cb();
        } else if (tries > 0) {
          setTimeout(() => whenRendered(cb, tries - 1), 250);
        }
      };

      const enhance = () =>
        whenRendered(() => {
          lib.cleanupMermaidEnhancements?.();
          lib.enhanceMermaidDiagrams();
        });

      // Chirpy re-renders diagrams on theme toggle; re-attach pan/zoom after.
      // Multiple passes keep pan/zoom on the final SVG (re-render is async).
      const observer = new MutationObserver(() => {
        enhance();
        setTimeout(enhance, 600);
        setTimeout(enhance, 1800);
      });
      observer.observe(document.documentElement, {
        attributes: true,
        attributeFilter: ['data-bs-theme']
      });

      if (document.readyState === 'loading') {
        window.addEventListener('DOMContentLoaded', enhance);
      } else {
        enhance();
      }
    })();
  </script>
{% endif %}
